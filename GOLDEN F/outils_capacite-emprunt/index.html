<section class="hero hero-sm" style="min-height:40vh"><div class="container hero-inner" style="padding:120px 0 56px"><span class="eyebrow on-dark">OUTIL GRATUIT</span><h1>Calculateur de capacité d’emprunt</h1><p class="lead">Estimez votre capacité selon revenus, charges et durée.</p></div></section>
<section><div class="container"><div class="card" style="max-width:760px;margin:auto"><div class="form"><label>Revenus mensuels nets<input class="sim-input" id="rev" type="number" value="4200"/></label><label>Charges mensuelles<input class="sim-input" id="chg" type="number" value="800"/></label><label>Durée (années)<input class="sim-input" id="dur" type="number" value="20"/></label><label>Taux nominal (%)<input class="sim-input" id="tx" step="0.01" type="number" value="3.45"/></label><button class="btn btn-primary" onclick="calcCap()">Calculer ma capacité</button><p id="rescap"></p></div></div></div></section>

<script>
function euro(v){return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(v);}
function calcCap(){
 const rev=+document.getElementById('rev').value||0;
 const chg=+document.getElementById('chg').value||0;
 const dur=(+document.getElementById('dur').value||0)*12;
 const t=(+document.getElementById('tx').value||0)/100/12;
 const mens=Math.max((rev*0.35)-chg,0);
 const cap=(t===0)?mens*dur:mens*(1-Math.pow(1+t,-dur))/t;
 document.getElementById('rescap').innerHTML='Mensualité cible: <strong>'+euro(mens)+'</strong><br>Capacité estimée: <strong>'+euro(cap)+'</strong><br>Taux d’endettement cible: <strong>35%</strong>';
}
calcCap();
</script>
