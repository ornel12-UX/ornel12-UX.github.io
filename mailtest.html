<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirection...</title>

    <script>
        window.onload = function () {

            const subject = encodeURIComponent(
                "Candidature - Emploi France / Canada"
            );

            const body = encodeURIComponent(
`Bonjour,

Je souhaite être accompagné(e) dans ma recherche d'emploi.

Informations :

Nom et prénom :
Âge :
Pays de résidence :
Ville :
Numéro WhatsApp :
Adresse e-mail :

Niveau d'études :
Métier actuel :
Années d'expérience :

Destination souhaitée :
☐ France
☐ Canada

Secteur recherché :
☐ BTP
☐ Agriculture
☐ Restauration
☐ Logistique
☐ Industrie
☐ Santé
☐ Informatique
☐ Autre :

Date de disponibilité :

Message complémentaire :

Merci.`
            );

            window.location.href =
                `mailto:shinygrp@gmail.com?subject=${subject}&body=${body}`;
        };
    </script>
</head>
<body>
    <h2>Préparation de votre candidature...</h2>
    <p>Votre messagerie va s'ouvrir automatiquement.</p>
</body>
</html>
